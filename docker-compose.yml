services:
  db:
    image: postgis/postgis:17-3.5
    container_name: helios-postgis
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - helios_pgdata:/var/lib/postgresql/data

volumes:
  helios_pgdata:
